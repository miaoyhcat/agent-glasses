[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexglasses"
version = "0.2.0"
description = "Personal noncommercial smart-glasses engineering prototype and authenticated Codex bridge"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.14.4,<4", "cryptography>=50.0.2,<51"]
license = {text = "LicenseRef-CodexGlasses-Personal-Noncommercial-1.0"}

[project.optional-dependencies]
ble = ["bleak>=0.22.3,<4"]
halo = ["brilliant-ble==3.4.0"]

[project.scripts]
codexglasses = "codexglasses.cli:main"

[tool.setuptools]
package-dir = {"" = "desktop"}

[tool.setuptools.packages.find]
where = ["desktop"]

[tool.setuptools.package-data]
codexglasses = ["web/*"]
