<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodexGlasses 工作台</title><style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#0e141d;color:#e8edf4}body{max-width:1050px;margin:auto;padding:24px}h1{font-size:28px;margin:6px 0}small,.muted{color:#9baec3}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.badge{background:#213b39;color:#a3e5d7;padding:8px 12px;border-radius:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{padding:22px;background:#18212e;border:1px solid #2c394b;border-radius:16px;margin-bottom:18px}label{display:block;margin-top:14px}input,select,textarea{box-sizing:border-box;display:block;width:100%;padding:11px;background:#101821;color:inherit;border:1px solid #40516a;border-radius:8px;margin-top:7px}textarea{min-height:100px}button{cursor:pointer;color:#092b27;background:#9ce3d2;border:0;border-radius:8px;padding:11px 16px;margin:12px 8px 0 0;font-weight:700}button.secondary{background:#344258;color:#e8edf4}button:disabled{opacity:.5}#hud{background:#050d09;color:#adf6bd;border:1px solid #45634e;font-size:20px;min-height:150px;line-height:1.65;padding:20px;border-radius:12px;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}article{border-top:1px solid #344258;padding:14px 0}#error{color:#ffbdb5;min-height:24px}.note{font-size:13px;line-height:1.6}#mode{white-space:nowrap}@media(max-width:720px){.grid{grid-template-columns:1fr}body{padding:16px}header{align-items:flex-start}}
</style>
<header><div><small>CODEXGLASSES / ENGINEERING PREVIEW</small><h1>把任务留给电脑</h1><span class="muted">眼镜只显示有来源的状态和结果</span></div><span id="mode" class="badge">未连接</span></header>
<div class="grid"><div><section><h2>连接设备</h2><label>设备令牌<input id="token" type="password" autocomplete="off" placeholder="仅保存在当前页面内存"></label><button id="connect">连接</button><details><summary>新手机配对</summary><label>桌面端一次性配对码<input id="code" type="password"></label><button id="pair">绑定当前页面</button></details><p class="note muted">请先从可信渠道核对桌面端 TLS 证书。此页面不保存令牌。</p></section>
<section><h2>新任务</h2><label>已授权项目<select id="project"></select></label><label>操作<select id="action"><option value="inspect">检查问题（只读）</option><option value="fix">修复（独立副本）</option><option value="test">运行测试（独立副本）</option></select></label><label>指令<textarea id="prompt" placeholder="检查项目，列出可复现的问题"></textarea></label><label><input id="follow" type="checkbox" style="display:inline;width:auto">继续最近完成任务的会话和副本</label><button id="submit">发送任务</button><p class="note muted">任务须在电脑上批准后执行。修复保存在独立副本，完成后由你检查和合入。</p><div id="error" role="status"></div></section></div>
<div><section><h2>镜片 HUD 布局预览</h2><div id="hud">等待连接\n无任务百分比估算</div><p class="note muted">这是浏览器布局预览，不能代表实物亮度、视场或可读性。</p></section><section><h2>任务与事件</h2><div id="tasks">尚无任务</div><pre id="events"></pre></section></div></div>
<script>
let token='',cursor=0,timer=null,lines=[],requestId=null,latestTask=null;const $=id=>document.getElementById(id);
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||r.status);return data}
function status(text){$('error').textContent=text}
const names={pending:'等待电脑批准',preparing:'准备项目副本',running:'正在运行',cancel_requested:'已请求取消，等待确认',completed:'任务完成',failed:'任务失败',cancelled:'已取消',unknown:'连接异常，结果未知',rejected:'电脑已拒绝'};
async function refresh(){try{const [a,b]=await Promise.all([api('/v1/tasks'),api('/v1/events?after='+cursor)]);$('tasks').replaceChildren();for(const t of a.tasks){const row=document.createElement('article');const title=document.createElement('div');title.textContent=t.project+' · '+t.action+' · '+(names[t.status]||t.status);row.append(title);if(t.progress_text){const progress=document.createElement('p');progress.className='muted';progress.textContent=t.progress_text;row.append(progress)}if(!['completed','failed','cancelled','rejected','unknown'].includes(t.status)){const button=document.createElement('button');button.className='secondary';button.textContent='请求取消';button.onclick=async()=>{try{await api('/v1/tasks/'+t.id+'/cancel','POST',{});await refresh()}catch(e){status(e.message)}};row.append(button)}$('tasks').append(row)}for(const e of b.events){lines.push('#'+e.seq+' '+e.kind+' '+JSON.stringify(e.data))}lines=lines.slice(-12);cursor=b.cursor;$('events').textContent=lines.join('\n');if(a.tasks[0]){const t=a.tasks[0];$('hud').textContent=new Date().toLocaleTimeString()+'\n'+t.project+'\n'+(names[t.status]||t.status);if(t.last_summary)$('hud').textContent+='\n'+t.last_summary.slice(0,100)}}catch(e){status('连接中断：'+e.message);$('mode').textContent='连接中断'}}
$('connect').onclick=async()=>{try{token=$('token').value.trim();const [health,p]=await Promise.all([api('/health'),api('/v1/projects')]);$('mode').textContent=health.mode+' / '+health.computer_name;$('project').replaceChildren();for(const item of p.projects){const option=document.createElement('option');option.value=item.id;option.textContent=item.id;$('project').append(option)}cursor=0;lines=[];clearInterval(timer);timer=setInterval(refresh,1200);await refresh();status('已连接')}catch(e){status(e.message)}};
$('pair').onclick=async()=>{try{const p=await api('/v1/pair','POST',{code:$('code').value,name:'Browser companion'});$('token').value=p.token;$('code').value='';$('connect').click()}catch(e){status(e.message)}};
$('prompt').oninput=()=>requestId=null;
$('action').onchange=()=>requestId=null;$('project').onchange=()=>requestId=null;
$('follow').onchange=()=>requestId=null;
$('submit').onclick=async()=>{try{requestId=requestId||crypto.randomUUID();const tasks=await api('/v1/tasks');latestTask=tasks.tasks[0];const body={v:1,request_id:requestId,project:$('project').value,action:$('action').value,prompt:$('prompt').value};if($('follow').checked&&latestTask)body.parent_task_id=latestTask.id;await api('/v1/tasks','POST',body);requestId=null;status('任务已接收，等待电脑批准');await refresh()}catch(e){status(e.message)}};
</script></html>
